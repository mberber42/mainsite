name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/mainsite_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mainsite_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mainsite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Build
        env:
          PUBLIC_SITE_URL: https://mainsite.example.invalid
        run: npm run build
      - name: Install Chromium for browser accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Run SEO, axe, keyboard, and reflow checks
        env:
          PUBLIC_SITE_URL: https://mainsite.example.invalid
          AUDIT_BASE_URL: http://127.0.0.1:4321
        run: npm run test:seo-a11y
      - name: Upload Phase 4A accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-seo-accessibility
          path: |
            test-results/axe/
            test-results/phase4a-playwright-results.json
            test-results/playwright/
          if-no-files-found: ignore
